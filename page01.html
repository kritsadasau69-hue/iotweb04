<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Title</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Itim&family=Monomaniac+One&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: black;
      }

      a,
      i {
        color: white;
        font-size: 1.5rem;
      }

      .nav-hello span {
        color: rgb(0, 252, 210);
        font-family: Itim;
        font-size: 3.5rem;
      }

      .nav-menu a {
        font-family: Monomaniac One;
        text-decoration: none;
      }
      .nav-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 50px 80px;
      }
      .nav-menu,
      .nav-hello,
      .nav-icon {
        width: 100%;
      }
      .nav-hello {
        text-align: center;
      }
      .nav-icon {
        /*text-align: right; */
        display: flex;
        justify-content: flex-end;
        gap: 30px;
      }
      .nav-menu {
        display: flex;
        gap: 30px;
      }
      .per-info span {
        color: white;
        font-family: Monomaniac One;
        font-size: 1.2rem;
      }
      .per-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 100px;
      }
      #fwd {
        color: rgb(0, 252, 210);
      }
      .per-pic {
        display: flex;
        justify-content: center;
        margin-top: 150px;
      }
      .per-pic img {
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 40%;
        border: 5px solid rgb(0, 252, 210);
        box-shadow: 0 0 10px royalblue;
        padding: 9px;
      }
      a:hover {
        color: rgb(0, 252, 210);
      }
      i:hover {
        color: rgb(0, 252, 210);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav-bar">
        <div class="nav-menu">
          <a href="#">Portfolio</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </div>
        <div class="nav-hello">
          <span>Hello</span>
        </div>
        <div class="nav-icon">
          <i class="bi bi-github" href="#" target="_blank"></i>
          <i class="bi bi-linkedin" href="#" target="_blank"></i>
          <i class="bi bi-instagram" href="#" target="_blank"></i>
          <i class="bi bi-twitter" href="#" target="_blank"></i>
        </div>
      </div>
      <div class="per-info">
        <span>6819M10011</span>
        <span>Kritsadapong Thanaaekwisit</span>
        <span id="fwd">Freelance Web Developer</span>
        <span>Based In Thailand</span>
      </div>

      <div class="per-pic">
        <img src="images/person.png" alt="" />
      </div>
    </div>
  </body>
</html>
