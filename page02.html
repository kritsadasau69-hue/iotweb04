<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Title</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: black;
        margin: 0;
      }
      .nav-menu a,
      .nav-icon i {
        color: white;
        text-decoration: none;
      }
      .nav-menu a {
        font-family: "ibm plex mono";
      }
      .nav-menu a:hover,
      .nav-icon i:hover {
        color: greenyellow; /*rgb(0, 252, 210);*/
        font-weight: bold;
      }
      .nav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0px 100px;
        background-color: gray;
        padding: 20px 100px;
        border-radius: 0px 0px 20px 20px;
      }
      .nav-menu {
        display: flex;
        gap: 50px;
      }
      .nav-icon {
        display: flex;
        gap: 20px;
      }
      .hero-section {
        display: flex;
        align-items: center;
        margin: 120px 180px 100px 180px;
        gap: 80px;
      }
      .hero-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        margin-top: 50px;
      }
      #h-name {
        font-family: "raleway";
        font-size: 3rem;
        color: white; /*rgb(0, 252, 210);*/
        font-weight: bold;
        font-size: 2rem;
      }
      #h-lorem {
        font-family: "ibm plex mono";
        font-size: 1.5rem;
        color: gray;
      }
      .hero-image .img {
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 100%;
        border: 5px solid rgb(0, 252, 210);
        box-shadow: 0 0 10px royalblue;
        padding: 9px;
      }
      button {
        background-color: rgb(108, 161, 20); /*rgb(0, 252, 210);*/
        color: white;
        font-family: "ibm plex mono";
        padding: 30px 0px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
        width: 350px;
      }
      button:hover {
        background-color: rgb(71, 201, 78);
        box-shadow: 0px 4px 35px rgb(23, 192, 32);
        border: 1px solid rgb(46, 145, 26);
      }
      .work-with {
        margin-left: 250px;
      }
      .work-with span {
        font-family: "ibm plex mono";
        color: white;
      }
      .brand-section img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block; /* กัน inline gap และบังคับให้เต็มกรอบ a */
      }

      .brand-section img:hover {
        box-shadow: 0px 0px 10px rgb(14, 51, 45);
      }

      .brand-section {
        display: flex;
        margin: 30px 250px;
        justify-content: space-between;
        align-items: center;
      }

      .brand-section a {
        width: 70px; /* กำหนดขนาดกรอบตายตัว ไม่ปล่อยให้ยืดตามเนื้อหา */
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden; /* ตัวนี้สำคัญที่สุด - ตัดส่วนที่ล้นออก */
        border: 2px solid rgb(0, 252, 210);
        border-radius: 10px;
        box-sizing: border-box;
        padding: 0; /* เอา padding เดิมออก เพราะจะไปเบียดพื้นที่รูป */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- ส่วนของ navbar-->
      <div class="nav-bar">
        <div class="nav-menu">
          <a href="#">Home</a>
          <a href="#">Case Studies</a>
          <a href="#">Testimonials</a>
          <a href="#">Recent work</a>
          <a href="#">Get in touch</a>
        </div>

        <div class="nav-icon">
          <a href="#"><i class="bi bi-linkedin"></i></a>
          <a href="#"><i class="bi bi-behance"></i></a>
          <a href="#"><i class="bi bi-twitter"></i></a>
        </div>
      </div>

      <div class="hero-section">
        <div class="hero-info">
          <span id="h-name">Wisanu Mangkala</span>
          <span id="h-lorem"
            >Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellat
            animi accusamus harum illum dicta ipsa. Aspernatur, quidem non nihil
            odit consectetur id, minima quasi assumenda, eius officia soluta
            eaque autem?
          </span>
          <button>Let's get together</button>
        </div>

        <div class="hero-image">
          <img src="images/person.png" alt="" />
        </div>
      </div>

      <div class="work-with">
        <span>Work with me</span>
      </div>

      <div class="brand-section">
        <a href="#"><img src="./images/logo1.png" alt="" /></a>
        <a href="#"><img src="./images/logo2.png" alt="" /></a>
        <a href="#"><img src="./images/logo3.png" alt="" /></a>
        <a href="#"><img src="./images/logo4.png" alt="" /></a>
        <a href="#"><img src="./images/logo5.png" alt="" /></a>
      </div>
    </div>
  </body>
</html>
